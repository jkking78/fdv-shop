        return null;

      return (

          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill={fill}
          stroke={color}
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={`lucide lucide-${name} ${className}`}
          style={style}
          dangerouslySetInnerHTML={{
            __html: LucideIcon.map(([tag, attrs]) => {
              const attrStr = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ');

            const cloudItems = [];
            snapshot.forEach(doc => {
              cloudItems.push({ id: doc.id, ...doc.data() });
            });

            if (cloudItems.length > 0) {
              setProductsList(prev => {
                const nonCloud = prev.filter(p => !p.id.startsWith('cloud-') && !p.id.startsWith('custom-'));
                return [...cloudItems, ...nonCloud];
              });
            }
          }, err => {});

          return () => unsubscribe && unsubscribe();
        }

        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3500);
      };

      const handleImageFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          addToast('Veuillez sélectionner un fichier image valide.', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          setNewProduct(prev => ({
            ...prev,
            image: event.target.result,
            imagePreview: event.target.result
          }));
          addToast('Photo chargée !', 'info');
        };
        reader.readAsDataURL(file);
      };

        e.preventDefault();
        if (adminPasswordInput === ADMIN_SECRET) {
          setIsAdminAuthenticated(true);
          sessionStorage.setItem('fdv_admin_auth', 'true');
          setIsAdminAuthModalOpen(false);
          setIsAdminFormModalOpen(true);

          addToast('Connexion administrateur réussie.', 'info');
        } else {
          addToast('Code d’accès incorrect.', 'error');
          setAdminPasswordInput('');
        }
      };

      const handleAdminLogout = () => {
        setIsAdminAuthenticated(false);
        sessionStorage.removeItem('fdv_admin_auth');
        setIsAdminFormModalOpen(false);
        addToast('Déconnexion effectuée.', 'info');
      };

        e.preventDefault();
        if (!isAdminAuthenticated) return;
        if (!newProduct.title || !newProduct.price) return;

        const cleanTitle = sanitizeText(newProduct.title);
        const cleanDesc = sanitizeText(newProduct.description);

          id: `cloud-${Date.now()}`,
          title: cleanTitle,
          category: newProduct.category,
          price: Math.abs(parseFloat(newProduct.price)) || 0,
          currencySymbol: 'FCFA',
          installmentText: newProduct.installmentText || 'Produit en Stock',
          badge: newProduct.badge || 'Nouveau',
          rating: '5.0',
          reviewsCount: 1,
          image: newProduct.image || '/assets/wigs/bodywave-30.jpg',
          description: cleanDesc || 'Nouveau produit FDV shopping.',
          fabric: 'Qualité Supérieure',
          care: 'Entretien recommandé',
          sizes: ['Taille Unique'],
          colors: [{ name: 'Couleur Unique', hex: '#68486E' }],
          isNew: true
        };

        if (db && isFirebaseActive) {
          try {
            db.collection('products').doc(createdProd.id).set(createdProd);
          } catch(err) {}
        }

        const updated = [createdProd, ...productsList];
        setProductsList(updated);

        const customItemsOnly = updated.filter(p => p.id.startsWith('custom-') || p.id.startsWith('cloud-'));
        localStorage.setItem('fdv_custom_products', JSON.stringify(customItemsOnly));

        addToast(`Article "${cleanTitle}" publié !`, 'info');

        setActiveCategory(createdProd.category);
        document.getElementById('featured-section')?.scrollIntoView({ behavior: 'smooth' });

        if (!isAdminAuthenticated) return;

            db.collection('products').doc(productId).delete();

          {/* CHECKOUT MODAL */}
          {isCheckoutOpen && (
            <div className="modal-overlay" onClick={() => setIsCheckoutOpen(false)}>
              <div className="modal-content" style={{ maxWidth: '580px' }} onClick={(e) => e.stopPropagation()}>
                <button className="modal-close-btn" onClick={() => setIsCheckoutOpen(false)}>
                  <Icon name="x" size={20} />
                </button>
                <div style={{ padding: '32px' }}>
                  {checkoutStep === 'form' ? (
                    <form onSubmit={(e) => { e.preventDefault(); setCheckoutStep('success'); setCart([]); }}>
                      <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.6rem', marginBottom: '16px' }}>Valider Ma Commande</h3>
                      <div style={{ background: '#FAF6FA', padding: '12px', borderRadius: '12px', marginBottom: '16px', fontWeight: 700 }}>
                        Total à régler: {subtotal.toLocaleString('fr-FR')} FCFA
                      </div>
                      <input type="text" placeholder="Nom & Prénom" className="newsletter-input" style={{ width: '100%', marginBottom: '10px' }} required />
                      <input type="tel" placeholder="Numéro de Téléphone / WhatsApp" className="newsletter-input" style={{ width: '100%', marginBottom: '10px' }} required />
                      <input type="text" placeholder="Adresse ou Ville de Livraison" className="newsletter-input" style={{ width: '100%', marginBottom: '16px' }} required />
                      <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                        <span>CONFIRMER LA COMMANDE ({subtotal.toLocaleString('fr-FR')} FCFA)</span>
                      </button>
                    </form>
                  ) : (
                    <div style={{ textAlign: 'center', padding: '20px 0' }}>
                      <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '2rem', color: '#27AE60' }}>Commande Enregistrée !</h3>
                      <p style={{ margin: '12px 0 20px 0', color: '#6E6373' }}>Notre équipe vous contactera directement pour la livraison. Merci d’avoir choisi FDV shopping !</p>
                      <button className="btn-primary" style={{ margin: '0 auto' }} onClick={() => { setCheckoutStep('form'); setIsCheckoutOpen(false); }}>CONTINUER MES ACHATS</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* FLOATING TOASTS */}
          <div className="toast-container">
            {toasts.map(t => (
              <div key={t.id} className="toast" style={{ borderColor: t.type === 'error' ? '#E74C3C' : '#68486E' }}>
                <Icon name={t.type === 'error' ? 'alert-triangle' : 'check'} size={18} color={t.type === 'error' ? '#E74C3C' : '#27AE60'} />
                <span>{t.message}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
