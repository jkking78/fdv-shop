        stock: 5,
        badge: 'Nouveau',
        installmentText: 'Disponible en plusieurs couleurs',
        description: '',
        images: []
      });

      // AUTO-OPEN DEEP-LINKED PRODUCT MODAL FROM URL (e.g. ?product=wig-1)
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlProdId = params.get('product');
        if (urlProdId) {
          const matched = productsList.find(p => p.id === urlProdId);
          if (matched) {
            setQuickViewProduct(matched);
            setActiveModalImageIdx(0);
          }
        }
      }, []);

      useEffect(() => {
        if (db && isFirebaseActive) {
          const unsubscribe = db.collection('products').onSnapshot(snapshot => {
            const cloudItems = [];
            snapshot.forEach(doc => {
              cloudItems.push({ id: doc.id, ...doc.data() });
            });

            if (cloudItems.length > 0) {
              setProductsList(prev => {
                const nonCloud = prev.filter(p => !p.id.startsWith('cloud-') && !p.id.startsWith('custom-'));
                return [...cloudItems, ...nonCloud];
              });
            }
          }, err => {});

          return () => unsubscribe && unsubscribe();
        }
      }, []);

      const addToast = (message, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3500);
      };

      // PROMO CODE APPLICATION HANDLER
      const handleApplyPromoCode = (e) => {
        if (e) e.preventDefault();
        setPromoMessage({ text: '', type: '' });

        const cleanCode = String(promoInputCode || '').trim().toUpperCase();
        if (!cleanCode) {
          setPromoMessage({ text: 'Veuillez saisir un code promo.', type: 'error' });
          return;
        }

        const matched = promoCodesList.find(p => p.code.toUpperCase() === cleanCode && p.isActive);
        if (matched) {
          setAppliedPromo(matched);
          const discText = matched.discountType === 'percent' ? `-${matched.value}%` : `-${matched.value.toLocaleString('fr-FR')} FCFA`;
          setPromoMessage({ text: `✓ Code ${matched.code} appliqué (${discText}) !`, type: 'success' });
          addToast(`Code promo "${matched.code}" appliqué !`, 'info');
        } else {
          setAppliedPromo(null);
          setPromoMessage({ text: 'Code promo invalide ou expiré.', type: 'error' });
        }
      };

      const handleRemoveAppliedPromo = () => {
        setAppliedPromo(null);
        setPromoInputCode('');
        setPromoMessage({ text: '', type: '' });
        addToast('Code promo retiré.', 'info');
      };

      const handleCreatePromoCode = (e) => {
        if (e) e.preventDefault();
        if (!newPromoData.code || !newPromoData.value) {
          addToast('Veuillez renseigner le code et la valeur.', 'error');
          return;
        }

        const cleanCode = String(newPromoData.code).trim().toUpperCase();
        const promoPayload = {
          id: `promo-${Date.now()}`,
          code: cleanCode,
          discountType: newPromoData.discountType,
          value: parseFloat(newPromoData.value) || 0,
          isActive: true,
          description: newPromoData.description || `Réduction de ${newPromoData.value}${newPromoData.discountType === 'percent' ? '%' : ' FCFA'}`
        };

        const updatedPromos = [promoPayload, ...promoCodesList];
        setPromoCodesList(updatedPromos);
        setNewPromoData({ code: '', discountType: 'percent', value: 10, description: '' });
        addToast(`Code promo "${cleanCode}" créé avec succès !`, 'info');
      };

      const handleDeletePromoCode = (promoId) => {
        const updated = promoCodesList.filter(p => p.id !== promoId);
        setPromoCodesList(updated);
        addToast('Code promo supprimé.', 'info');
      };

      const handleMultiImageFileChange = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        const currentImages = productFormData.images || [];
        const availableSlots = 4 - currentImages.length;
        if (availableSlots <= 0) {
          addToast('Maximum 4 photos par article.', 'error');
          return;
        }

        const filesToProcess = files.slice(0, availableSlots);
        let loadedCount = 0;
        const newImgs = [...currentImages];

        filesToProcess.forEach(file => {
          if (!file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            newImgs.push(event.target.result);
            loadedCount++;
            if (loadedCount === filesToProcess.length) {
              setProductFormData(prev => ({
                ...prev,
                images: newImgs
              }));
              addToast(`${loadedCount} photo(s) ajoutée(s) !`, 'info');
            }
          };
          reader.readAsDataURL(file);
        });
      };

      const handleRemoveFormImage = (indexToRemove) => {
        setProductFormData(prev => ({
          ...prev,
          images: prev.images.filter((_, idx) => idx !== indexToRemove)
        }));
      };

      const populateEditForm = (product) => {
        setEditingProduct(product);
        setProductFormData({
          id: product.id,
          title: product.title || '',
          category: product.category || 'Perruques & Mèches',
          price: product.price || '',
          originalPrice: product.originalPrice || '',
          stock: product.stock !== undefined ? product.stock : 5,
          badge: product.badge || 'Nouveau',
          installmentText: product.installmentText || 'Disponible en plusieurs couleurs',
          description: product.description || '',
          images: (product.images && product.images.length > 0) ? [...product.images] : [product.image]
        });
        setIsAdminFormModalOpen(true);
      };

      const handleVerifyAdminAuth = (e) => {
        e.preventDefault();
        setAuthError('');

        const inputClean = String(adminPasswordInput || '').trim();
        if (inputClean === ADMIN_SECRET) {
          setIsAdminAuthenticated(true);
          sessionStorage.setItem('fdv_admin_auth', 'true');
          setIsAdminAuthModalOpen(false);
          setAdminPasswordInput('');
          addToast('Connexion Propriétaire réussie !', 'info');

          if (pendingProductToEdit) {
            populateEditForm(pendingProductToEdit);
            setPendingProductToEdit(null);
          } else {
            setEditingProduct(null);
            setProductFormData({
              id: null,
              title: '',
              category: 'Perruques & Mèches',
              price: '',
              originalPrice: '',
              stock: 5,
              badge: 'Nouveau',
              installmentText: 'Disponible en plusieurs couleurs',
              description: '',
              images: []
            });
            setIsAdminFormModalOpen(true);
          }
        } else {
          setAuthError('Mot de passe incorrect. Veuillez réessayer.');
          addToast('Code d’accès incorrect.', 'error');
          setAdminPasswordInput('');
        }
      };

      const handleAdminLogout = () => {
        setIsAdminAuthenticated(false);
        sessionStorage.removeItem('fdv_admin_auth');
        setIsAdminFormModalOpen(false);
        setEditingProduct(null);
        setPendingProductToEdit(null);
        setAuthError('');
        addToast('Mode Propriétaire désactivé.', 'info');
      };

      const handleOpenEditProduct = (product, e) => {
        if (e) e.stopPropagation();
        if (isAdminAuthenticated) {
          populateEditForm(product);
        } else {
          setPendingProductToEdit(product);
          setAuthError('');
          setIsAdminAuthModalOpen(true);
        }
      };

      const handleOpenNewProduct = () => {
        if (!isAdminAuthenticated) {
          setPendingProductToEdit(null);
          setAuthError('');
          setIsAdminAuthModalOpen(true);
          return;
        }
        setEditingProduct(null);
        setProductFormData({
          id: null,
          title: '',
          category: 'Perruques & Mèches',
          price: '',
          originalPrice: '',
          stock: 5,
          badge: 'Nouveau',
          installmentText: 'Disponible en plusieurs couleurs',
          description: '',
          images: []
        });
        setIsAdminFormModalOpen(true);
      };

      const handleSaveProduct = (e) => {
        if (e) e.preventDefault();
        if (!isAdminAuthenticated) return;
        if (!productFormData.title || !productFormData.price) {
          addToast('Veuillez remplir au moins le nom et le prix.', 'error');
          return;
        }

        const cleanTitle = sanitizeText(productFormData.title);
        const cleanDesc = sanitizeText(productFormData.description);
        const cleanBadge = sanitizeText(productFormData.badge);

        const imgList = (productFormData.images && productFormData.images.length > 0)
          ? productFormData.images
          : ['/assets/wigs/bodywave-30.jpg'];

        const productPayload = {
          id: editingProduct ? editingProduct.id : `cloud-${Date.now()}`,
          title: cleanTitle,
          category: productFormData.category,
          price: Math.abs(parseFloat(productFormData.price)) || 0,
          originalPrice: productFormData.originalPrice ? Math.abs(parseFloat(productFormData.originalPrice)) : null,
          currencySymbol: 'FCFA',
          stock: Math.max(0, parseInt(productFormData.stock, 10) || 0),
          installmentText: productFormData.installmentText || 'Produit en Stock',
          badge: cleanBadge || 'Nouveau',
          rating: '5.0',
          reviewsCount: editingProduct ? editingProduct.reviewsCount : 1,
          images: imgList,
          image: imgList[0],
          description: cleanDesc || 'Produit FDV shopping.',
          fabric: 'Qualité Supérieure',
          care: 'Entretien recommandé',
          sizes: ['Taille Unique'],
          colors: [{ name: 'Couleur Unique', hex: '#5C3260' }],
          isNew: true
        };

        if (db && isFirebaseActive) {
          try {
            db.collection('products').doc(productPayload.id).set(productPayload);
          } catch(err) {}
        }

        let updatedList = [];
        if (editingProduct) {
          updatedList = productsList.map(p => p.id === productPayload.id ? productPayload : p);
          addToast(`Article "${cleanTitle}" mis à jour !`, 'info');
        } else {
          updatedList = [productPayload, ...productsList];
          addToast(`Article "${cleanTitle}" créé !`, 'info');
        }

        setProductsList(updatedList);

        const customItemsOnly = updatedList.filter(p => p.id.startsWith('custom-') || p.id.startsWith('cloud-'));
        localStorage.setItem('fdv_custom_products', JSON.stringify(customItemsOnly));

        setIsAdminFormModalOpen(false);
        setEditingProduct(null);
        setActiveCategory(productPayload.category);
      };

      const handleDeleteProduct = (productId) => {
        if (!isAdminAuthenticated) return;
        if (db && isFirebaseActive && productId.startsWith('cloud-')) {
          try {
            db.collection('products').doc(productId).delete();
          } catch(err) {}
        }

        const updated = productsList.filter(p => p.id !== productId);
        setProductsList(updated);
        const customItemsOnly = updated.filter(p => p.id.startsWith('custom-') || p.id.startsWith('cloud-'));
        localStorage.setItem('fdv_custom_products', JSON.stringify(customItemsOnly));
        addToast('Produit supprimé.', 'info');
        setIsAdminFormModalOpen(false);
      };

      // WHATSAPP REDIRECTION SYSTEM WITH DYNAMIC ITEM DIRECT LINKS, QUANTITIES & PROMO DETAILS
      const handleOrderOnWhatsApp = (cartItems, clientInfo = {}) => {
        const baseUrl = window.location.origin + window.location.pathname;
        let msg = `Bonjour FDV shopping ! Je souhaite commander les articles suivants :\n\n`;
        
        cartItems.forEach((item, idx) => {
          const itemUrl = `${baseUrl}?product=${item.id}`;
          const q = item.quantity || 1;
          msg += `${idx + 1}. *${item.title}*\n`;
          msg += `   🔗 Lien: ${itemUrl}\n`;
          msg += `   - Quantité: ${q}\n`;
          msg += `   - Prix: ${(item.price * q).toLocaleString('fr-FR')} FCFA\n\n`;
        });
        
        const rawSubtotal = cartItems.reduce((a, c) => a + c.price * (c.quantity || 1), 0);
        let discountAmount = 0;

        if (appliedPromo) {
          if (appliedPromo.discountType === 'percent') {
            discountAmount = Math.round((rawSubtotal * appliedPromo.value) / 100);
          } else {
            discountAmount = appliedPromo.value;
          }
        }

        const finalTotal = Math.max(0, rawSubtotal - discountAmount);

        msg += `💵 Sous-total : ${rawSubtotal.toLocaleString('fr-FR')} FCFA\n`;
        if (appliedPromo) {
          msg += `🎟️ Code Promo : *${appliedPromo.code}* (-${discountAmount.toLocaleString('fr-FR')} FCFA)\n`;
        }
        msg += `💰 *TOTAL FINAL À RÉGLER : ${finalTotal.toLocaleString('fr-FR')} FCFA*\n\n`;

        if (clientInfo.name) msg += `👤 Nom Client: ${clientInfo.name}\n`;
        if (clientInfo.address) msg += `📍 Adresse/Ville de livraison: ${clientInfo.address}\n`;

        msg += `\nMerci d'avance pour la confirmation de ma commande !`;

        const encodedMsg = encodeURIComponent(msg);
        const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodedMsg}`;
        window.open(waUrl, '_blank');
      };

      const filteredProducts = productsList.filter(p => {
        if (activeCategory === 'Tous les articles') return true;
        if (activeCategory === 'Nouveautés') return p.isNew;
        return p.category === activeCategory;
      });

      const searchedProducts = productsList.filter(p =>
        p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.category.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const handleAddToCart = (productToAdd, e) => {
        if (e) e.stopPropagation();
        if (productToAdd.stock === 0) {
          addToast(`Cet article est actuellement en rupture de stock.`, 'error');
          return;
        }
        const size = productToAdd.selectedSize || productToAdd.sizes?.[0] || 'Unique';
        const color = productToAdd.selectedColor || (productToAdd.colors?.[0] ? productToAdd.colors[0].name : 'Unique');
        const qty = productToAdd.quantity || getSelectedQty(productToAdd.id) || 1;

        setCart(prev => {
          const idx = prev.findIndex(item => item.id === productToAdd.id && item.selectedSize === size && item.selectedColor === color);
          if (idx > -1) {
            const updated = [...prev];
            const newQty = Math.min(productToAdd.stock, updated[idx].quantity + qty);
            updated[idx].quantity = newQty;
            return updated;
          }
          return [...prev, { ...productToAdd, selectedSize: size, selectedColor: color, quantity: qty }];
        });

        addToast(`"${productToAdd.title}" (${qty}) ajouté au panier.`, 'cart');
        setIsCartOpen(true);
      };

      const handleToggleWishlist = (product, e) => {
        if (e) e.stopPropagation();
        if (wishlistIds.includes(product.id)) {
          setWishlistIds(prev => prev.filter(id => id !== product.id));
          addToast(`Retiré des favoris.`, 'info');
        } else {
          setWishlistIds(prev => [...prev, product.id]);
          addToast(`Ajouté aux favoris.`, 'info');
        }
      };

      const handleUpdateQty = (item, newQty) => {
        if (newQty <= 0) {
          setCart(prev => prev.filter(i => !(i.id === item.id && i.selectedSize === item.selectedSize && i.selectedColor === item.selectedColor)));
          return;
        }
        setCart(prev => prev.map(i => (i.id === item.id && i.selectedSize === item.selectedSize && i.selectedColor === item.selectedColor) ? { ...i, quantity: newQty } : i));
      };

      const handleRemoveFromCart = (item) => {
        setCart(prev => prev.filter(i => !(i.id === item.id && i.selectedSize === item.selectedSize && i.selectedColor === item.selectedColor)));
        addToast('Article retiré.', 'info');
      };

      const handleShareOnFacebook = (product) => {
        const prodUrl = encodeURIComponent(`${window.location.origin}${window.location.pathname}?product=${product.id}`);
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${prodUrl}`, '_blank', 'width=600,height=400');
      };

      const subtotal = cart.reduce((a, c) => a + c.price * c.quantity, 0);

      let discountCalculated = 0;
      if (appliedPromo) {
        if (appliedPromo.discountType === 'percent') {
          discountCalculated = Math.round((subtotal * appliedPromo.value) / 100);
        } else {
          discountCalculated = appliedPromo.value;
        }
      }

      const totalAfterDiscount = Math.max(0, subtotal - discountCalculated);

      const wishlistProducts = productsList.filter(p => wishlistIds.includes(p.id));

      const isAnyModalActive = isAdminFormModalOpen || quickViewProduct || isCartOpen || isWishlistOpen || isSearchOpen || isAdminAuthModalOpen;

      return (
        <div className="app-layout">
          {/* FLOATING ADMIN BAR WHEN AUTHENTICATED AND NO MODALS OPEN */}
          {isAdminAuthenticated && !isAnyModalActive && (
            <div className="admin-floating-bar">
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#27AE60', display: 'inline-block' }}></span>
                <span style={{ fontSize: '0.82rem', fontWeight: 700, color: '#FFFFFF' }}>Mode Propriétaire Connecté</span>
              </div>
              <button
                className="btn-primary"
                style={{ padding: '6px 14px', fontSize: '0.78rem', borderRadius: '16px' }}
                onClick={handleOpenNewProduct}
              >
                <Icon name="plus-circle" size={14} color="#FFFFFF" />
                <span>+ Ajouter un Article</span>
              </button>
              <button
                onClick={handleAdminLogout}
                style={{ background: '#FADBD8', color: '#E74C3C', border: 'none', padding: '6px 12px', borderRadius: '14px', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer' }}
              >
                Déconnexion
              </button>
            </div>
          )}

          {/* 1. TOP ANNOUNCEMENT BAR (CLEAN, NO PUBLIC CODES EXPOSED) */}
          <div className="announcement-bar">
            <div className="announcement-content">
              <span>Collection Perruques Human Hair • Éventails Pagne Wax (1 700 FCFA) • Commandes WhatsApp: 07 78 73 95 27</span>
            </div>
          </div>

          {/* 2. MAIN HEADER */}
          <header className="main-header">
            <div className="header-container">
              <a href="#" className="brand-logo" onClick={() => setActiveCategory('Perruques & Mèches')}>
                <div className="brand-emblem">
                  <span style={{ fontFamily: 'var(--font-serif)', fontSize: '1rem', fontWeight: 700 }}>FDV</span>
                </div>
                <div>
                  <span className="brand-logo-title">FDV shopping</span>
                  <span className="brand-subtext">HAUTE BEAUTÉ & COUTURE</span>
                </div>
              </a>

              <nav className="desktop-nav">
                <ul className="nav-links">
                  {[
                    { label: 'Accueil', cat: 'Perruques & Mèches' },
                    { label: 'Perruques & Mèches', cat: 'Perruques & Mèches' },
                    { label: 'Éventails en Pagne', cat: 'Éventails en Pagne' },
                    { label: 'Robes & Ensembles', cat: 'Robes & Ensembles' }
                  ].map((item, idx) => (
                    <li key={idx}>
                      <button
                        className={`nav-link ${activeCategory === item.cat ? 'active' : ''}`}
                        onClick={() => {
                          setActiveCategory(item.cat);
                          document.getElementById('featured-section')?.scrollIntoView({ behavior: 'smooth' });
                        }}
                      >
                        {item.label}
                      </button>
                    </li>
                  ))}
                </ul>
              </nav>

              <div className="header-actions">
                {isAdminAuthenticated && (
                  <button
                    onClick={handleAdminLogout}
                    className="admin-header-pill"
                    title="Cliquer pour se déconnecter du mode Propriétaire"
                  >
                    <span className="admin-status-dot"></span>
                    <span>Admin</span>
                  </button>
                )}
                <button className="icon-btn" onClick={() => setIsSearchOpen(true)} title="Rechercher">
                  <Icon name="search" size={20} color="#2A172E" />
                </button>
                <button className="icon-btn" onClick={() => setIsWishlistOpen(true)} title="Favoris">
                  <Icon name="heart" size={20} color="#2A172E" />
                  {wishlistIds.length > 0 && <span className="icon-badge">{wishlistIds.length}</span>}
                </button>
                <button className="icon-btn" onClick={() => setIsCartOpen(true)} title="Panier">
                  <Icon name="shopping-bag" size={20} color="#2A172E" />
                  {cart.reduce((a, c) => a + c.quantity, 0) > 0 && (
                    <span className="icon-badge">{cart.reduce((a, c) => a + c.quantity, 0)}</span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* 3. HERO BANNER */}
          <section className="hero-section">
            <div className="hero-glow-1"></div>
            <div className="hero-glow-2"></div>
            <div className="hero-container">
              <div className="hero-content">
                <div className="hero-tag">
                  <span>COLLECTION HAUTE COUTURE 2026</span>
                </div>
                <h1 className="hero-title">
                  ÉLÉGANCE & <br />
                  <span className="hero-title-accent">MAGNIFICENCE</span>
                </h1>
                <p className="hero-subtitle">
                  Cheveux 100% humains, Body Wave, Deep Wave, Lisse & Coupe Carré. Éventails en Pagne fait main.
                </p>
                <div>
                  <button
                    className="btn-primary"
                    onClick={() => {
                      setActiveCategory('Perruques & Mèches');
                      document.getElementById('featured-section')?.scrollIntoView({ behavior: 'smooth' });
                    }}
                  >
                    <span>EXPLORER LA COLLECTION</span>
                    <Icon name="arrow-right" size={16} color="#FFFFFF" />
                  </button>
                </div>
              </div>

              <div className="hero-image-wrapper">
                <div className="hero-card-frame">
                  <img src="/assets/wigs/bodywave-30.jpg" alt="Body Wave Taille 30" />
                </div>
              </div>
            </div>
          </section>

          {/* 4. FEATURED COLLECTION GRID */}
          <section id="featured-section" className="section-container">
            <div className="section-header">
              <div>
                <span className="section-subtitle">BOUTIQUE EN LIGNE ({filteredProducts.length} ARTICLES)</span>
                <h2 className="section-title">Catalogue {activeCategory}</h2>
              </div>

              {/* ONLY VISIBLE WHEN PROPRIETAIRE HAS AUTHENTICATED */}
              {isAdminAuthenticated && (
                <button className="btn-add-product-compact" onClick={handleOpenNewProduct}>
                  <Icon name="plus-circle" size={15} color="#FFFFFF" />
                  <span>+ Ajouter un Produit</span>
                </button>
              )}
            </div>

            <div className="category-pills">
              {CATEGORIES.map((cat, idx) => (
                <button
                  key={idx}
                  className={`category-pill ${activeCategory === cat ? 'active' : ''}`}
                  onClick={() => setActiveCategory(cat)}
                >
                  {cat}
                </button>
              ))}
            </div>

            <div className="product-grid">
              {filteredProducts.map(product => {
                const isWishlisted = wishlistIds.includes(product.id);
                const isOutOfStock = product.stock === 0;
                const displayImage = (product.images && product.images.length > 0) ? product.images[0] : product.image;
                const currentSelectedQty = getSelectedQty(product.id);
                return (
                  <div key={product.id} className="product-card">
                    <div className="product-image-box">
                      {product.badge && (
                        <span className={`card-badge ${isOutOfStock ? 'out-of-stock' : product.badge === 'Nouveau' ? 'new' : product.badge === 'Top Vente' ? 'bestseller' : ''}`}>
                          {isOutOfStock ? 'Rupture' : product.badge}
                        </span>
                      )}

                      <button
                        className={`card-wishlist-btn ${isWishlisted ? 'active' : ''}`}
                        onClick={(e) => handleToggleWishlist(product, e)}
                        title={isWishlisted ? "Cliquer pour retirer des favoris" : "Ajouter aux favoris"}
                      >
                        <Icon name="heart" size={16} fill={isWishlisted ? '#E2A7B4' : 'none'} color={isWishlisted ? '#E2A7B4' : '#6C5B70'} />
                      </button>

                      <img src={displayImage} alt={product.title} loading="lazy" />

                      <div className="card-quick-actions">
                        <button className="btn-add-cart" onClick={(e) => handleAddToCart(product, e)} disabled={isOutOfStock}>
                          <Icon name="shopping-bag" size={15} color="#FFFFFF" />
                          <span>{isOutOfStock ? 'Rupture' : 'Ajouter au panier'}</span>
                        </button>
                        <button className="btn-quick-view" onClick={() => { setQuickViewProduct(product); setActiveModalImageIdx(0); }} title="Aperçu grand format">
                          <Icon name="eye" size={16} color="#2A172E" />
                        </button>
                      </div>
                    </div>

                  </div>
                  <button
                    onClick={() => setIsCartOpen(false)}
                    style={{ background: 'rgba(255, 255, 255, 0.15)', border: '1px solid rgba(255, 255, 255, 0.3)', color: '#FFFFFF', width: '36px', height: '36px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}
                  >
                    <Icon name="x" size={18} color="#FFFFFF" />
                  </button>
                </div>

                {/* 2. REASSURANCE STRIP */}
                <div className="cart-reassurance-strip">
                  <span>🚚 Livraison Express Abidjan</span>
                  <span>🔒 Service Direct WhatsApp</span>
                </div>

                {/* 3. SCROLLABLE ITEMS LIST */}
                <div className="cart-items-list-luxury">
                  {cart.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '60px 20px', color: '#6C5B70', margin: 'auto' }}>
                      <div style={{ width: '64px', height: '64px', borderRadius: '50%', background: '#F7EBEF', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: '16px' }}>
                        <Icon name="shopping-bag" size={30} color="#5C3260" />
                      </div>
                      <h4 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.4rem', color: 'var(--purple-dark)', marginBottom: '8px' }}>Votre Panier est Vide</h4>
                      <p style={{ fontSize: '0.88rem', color: '#6C5B70', marginBottom: '20px', maxWidth: '280px', margin: '0 auto 20px' }}>
                        Découvrez nos magnifiques perruques 100% human hair & nos éventails en pagne faits main.
                      </p>
                      <button
                        className="btn-primary"
                        style={{ fontSize: '0.84rem', padding: '10px 22px' }}
                        onClick={() => setIsCartOpen(false)}
                      >
                        EXPLORER LA COLLECTION
                      </button>
                    </div>
                  ) : (
                    cart.map((item, idx) => (
                      <div key={`${item.id}-${item.selectedSize}-${idx}`} className="cart-item-card">
                        <img src={item.image} alt={item.title} className="cart-item-img-luxury" />
                        
                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                          <div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '8px' }}>
                              <h4 style={{ fontSize: '0.92rem', fontWeight: 700, color: 'var(--purple-dark)', lineHeight: '1.35', margin: 0 }}>
                                {item.title}
                              </h4>
                              <button
                                onClick={() => handleRemoveFromCart(item)}
                                style={{ background: 'none', border: 'none', color: '#9B8F9E', cursor: 'pointer', padding: '2px' }}
                                title="Retirer cet article"
                              >
                                <Icon name="trash-2" size={16} color="#E74C3C" />
                              </button>
                            </div>

                            <span style={{ fontSize: '0.72rem', color: 'var(--purple-accent)', fontWeight: 600, display: 'block', marginTop: '2px' }}>
                              {item.category}
                            </span>
                          </div>

                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '10px' }}>
                            <div className="card-qty-selector">
                              <button className="card-qty-btn" onClick={() => handleUpdateQty(item, item.quantity - 1)}>-</button>
                              <span className="card-qty-value">{item.quantity}</span>
                              <button className="card-qty-btn" onClick={() => handleUpdateQty(item, Math.min(item.stock || 99, item.quantity + 1))}>+</button>
                            </div>

                            <div style={{ fontWeight: 800, fontSize: '0.95rem', color: 'var(--purple-dark)' }}>
                              {(item.price * item.quantity).toLocaleString('fr-FR')} FCFA
                            </div>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* 4. PROMO CODE FIELD & SUMMARY FOOTER */}
                {cart.length > 0 && (
                  <div className="cart-footer-luxury">
                    
                    {/* PROMO CODE INPUT BOX */}
                    <div style={{ background: '#FAF6FA', padding: '12px 14px', borderRadius: '16px', border: '1px solid rgba(226, 167, 180, 0.3)', marginBottom: '12px' }}>
                      <span style={{ fontSize: '0.78rem', fontWeight: 800, color: 'var(--purple-dark)', display: 'block', marginBottom: '6px' }}>
                        🎟️ Possédez-vous un Code Promo ?
                      </span>

                      {appliedPromo ? (
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#D4EFDF', color: '#196F3D', padding: '8px 12px', borderRadius: '12px', fontSize: '0.82rem', fontWeight: 800 }}>
                          <span>✓ Code {appliedPromo.code} appliqué ({appliedPromo.discountType === 'percent' ? `-${appliedPromo.value}%` : `-${appliedPromo.value.toLocaleString('fr-FR')} FCFA`})</span>
                          <button onClick={handleRemoveAppliedPromo} style={{ background: 'none', border: 'none', color: '#E74C3C', fontWeight: 800, cursor: 'pointer', marginLeft: '8px' }}>
                            ✕
                          </button>
                        </div>
                      ) : (
                        <form onSubmit={handleApplyPromoCode} style={{ display: 'flex', gap: '6px' }}>
                          <input
                            type="text"
                            placeholder="Saisir votre code secret"
                            value={promoInputCode}
                            onChange={(e) => setPromoInputCode(e.target.value)}
                            style={{ flex: 1, padding: '8px 12px', borderRadius: '12px', border: '1px solid rgba(226, 167, 180, 0.4)', fontSize: '0.85rem', textTransform: 'uppercase', outline: 'none' }}
                          />
                          <button type="submit" className="btn-primary" style={{ padding: '8px 14px', borderRadius: '12px', fontSize: '0.78rem' }}>
                            Appliquer
                          </button>
                        </form>
                      )}

                      {promoMessage.text && !appliedPromo && (
                        <span style={{ fontSize: '0.75rem', fontWeight: 700, color: promoMessage.type === 'error' ? '#E74C3C' : '#27AE60', display: 'block', marginTop: '6px' }}>
                          {promoMessage.text}
                        </span>
                      )}
                    </div>

                    {/* PRICE SUMMARY BREAKDOWN */}
                    <div style={{ background: '#FAF6FA', padding: '14px 16px', borderRadius: '16px', border: '1px solid rgba(226, 167, 180, 0.25)', marginBottom: '16px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.82rem', color: '#6C5B70', marginBottom: '6px' }}>
                        <span>Sous-total articles ({cart.reduce((a, c) => a + c.quantity, 0)})</span>
                        <span style={{ fontWeight: 700, color: 'var(--purple-dark)' }}>{subtotal.toLocaleString('fr-FR')} FCFA</span>
                      </div>

                      {appliedPromo && (
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.82rem', color: '#27AE60', fontWeight: 700, marginBottom: '6px' }}>
                          <span>Réduction ({appliedPromo.code})</span>
                          <span>-{discountCalculated.toLocaleString('fr-FR')} FCFA</span>
                        </div>
                      )}
                      
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.82rem', color: '#6C5B70', marginBottom: '10px' }}>
                        <span>Expédition & Livraison</span>
                        <span style={{ fontSize: '0.78rem', color: '#27AE60', fontWeight: 700 }}>Confirmées sur WhatsApp</span>
                      </div>

                      <div style={{ borderTop: '1px dashed rgba(226, 167, 180, 0.4)', paddingTop: '10px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span style={{ fontWeight: 800, fontSize: '0.95rem', color: 'var(--purple-dark)' }}>Total à Régler</span>
                        <span style={{ fontWeight: 800, fontSize: '1.25rem', color: 'var(--purple-dark)' }}>
                          {totalAfterDiscount.toLocaleString('fr-FR')} FCFA
                        </span>
                      </div>
                    </div>

                    <button
                      className="btn-whatsapp-checkout"
                      onClick={() => handleOrderOnWhatsApp(cart)}
                    >
                      <Icon name="whatsapp" size={20} color="#FFFFFF" />
                      <span>COMMANDER SUR WHATSAPP</span>
                    </button>
                    
                    <span style={{ display: 'block', textAlign: 'center', fontSize: '0.72rem', color: '#6C5B70', marginTop: '8px', fontWeight: 600 }}>
                      ⚡ Validation instantanée avec le vendeur (07 78 73 95 27)
                    </span>
                  </div>
                )}
              </div>
            </>
          )}

          {/* HIGH-DEFINITION CLEAN QUICK VIEW MODAL (EYE ICON 👁️) */}
          {quickViewProduct && (
            <div className="modal-overlay" onClick={() => setQuickViewProduct(null)}>
              <div className="quickview-modal-content" onClick={(e) => e.stopPropagation()}>
                <button className="modal-close-btn" onClick={() => setQuickViewProduct(null)}>
                  <Icon name="x" size={18} color="#2A172E" />
                </button>

                <div className="quickview-grid">
                  {/* LEFT: HIGH-DEF PHOTO GALLERY */}
                  <div>
                    {(() => {
                      const allImgs = (quickViewProduct.images && quickViewProduct.images.length > 0)
                        ? quickViewProduct.images
                        : [quickViewProduct.image];
                      const mainImg = allImgs[activeModalImageIdx] || allImgs[0];
                      return (
                        <>
                          <img src={mainImg} alt={quickViewProduct.title} className="quickview-img-large" />
                          {allImgs.length > 1 && (
                            <div className="modal-gallery-thumbs">
                              {allImgs.map((imgSrc, idx) => (
                                <img
                                  key={idx}
                                  src={imgSrc}
                                  alt={`Vignette ${idx+1}`}
                                  className={`modal-thumb ${activeModalImageIdx === idx ? 'active' : ''}`}
                                  onClick={() => setActiveModalImageIdx(idx)}
                                />
                              ))}
                            </div>
                          )}
                        </>
                      );
                    })()}
                  </div>

                  {/* RIGHT: ARTICLE DETAILS & ACTIONS */}
                  <div style={{ display: 'flex', flexDirection: 'column' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                      <span className="product-category">{quickViewProduct.category}</span>
                      <button className="fb-share-btn" onClick={() => handleShareOnFacebook(quickViewProduct)}>
                        <Icon name="share-2" size={14} color="#FFFFFF" />
                        <span>Partager</span>
                      </button>
                    </div>

                    <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.8rem', margin: '0 0 8px 0', color: 'var(--purple-dark)', lineHeight: '1.2' }}>
                      {quickViewProduct.title}
                    </h2>
                    
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '14px' }}>
                      <div>
                        <span style={{ fontSize: '1.5rem', fontWeight: 700, color: 'var(--purple-dark)' }}>
                          {quickViewProduct.price.toLocaleString('fr-FR')} FCFA
                        </span>
                        {quickViewProduct.originalPrice && (
                          <span style={{ fontSize: '0.9rem', color: '#9B8F9E', textDecoration: 'line-through', marginLeft: '8px' }}>
                            {quickViewProduct.originalPrice.toLocaleString('fr-FR')} FCFA
                          </span>
                        )}
                      </div>
                      <span className={`stock-pill ${quickViewProduct.stock === 0 ? 'no-stock' : quickViewProduct.stock <= 3 ? 'low-stock' : 'in-stock'}`}>
                        {quickViewProduct.stock === 0 ? 'Épuisé' : `${quickViewProduct.stock} en stock`}
                      </span>
                    </div>

                    <div style={{ background: '#FAF6FA', padding: '12px 14px', borderRadius: '14px', border: '1px solid rgba(226, 167, 180, 0.25)', marginBottom: '16px' }}>
                      <p style={{ color: '#6C5B70', fontSize: '0.88rem', lineHeight: '1.4', margin: 0 }}>
                        {quickViewProduct.description}
                      </p>
                    </div>

                    {/* QUANTITY SELECTOR IN QUICK VIEW MODAL */}
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '16px' }}>
                      <span style={{ fontSize: '0.82rem', fontWeight: 700, color: 'var(--purple-dark)' }}>Quantité :</span>
                      <div className="card-qty-selector">
                        <button
                          type="button"
                          className="card-qty-btn"
                          onClick={() => updateSelectedQty(quickViewProduct, -1)}
                          disabled={quickViewProduct.stock === 0 || getSelectedQty(quickViewProduct.id) <= 1}
                        >
                          -
                        </button>
                        <span className="card-qty-value">{quickViewProduct.stock === 0 ? 0 : getSelectedQty(quickViewProduct.id)}</span>
                        <button
                          type="button"
                          className="card-qty-btn"
                          onClick={() => updateSelectedQty(quickViewProduct, 1)}
                          disabled={quickViewProduct.stock === 0 || getSelectedQty(quickViewProduct.id) >= quickViewProduct.stock}
                        >
                          +
                        </button>
                      </div>
                      <span style={{ fontSize: '0.75rem', color: '#6C5B70' }}>(Stock: {quickViewProduct.stock})</span>
                    </div>
                    
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginTop: 'auto' }}>
                      <button
                        className="btn-whatsapp"
                        style={{ width: '100%', justifyContent: 'center', padding: '12px' }}
                        onClick={() => handleOrderOnWhatsApp([{ ...quickViewProduct, quantity: getSelectedQty(quickViewProduct.id) }])}
                        disabled={quickViewProduct.stock === 0}
                      >
                        <Icon name="whatsapp" size={18} color="#FFFFFF" />
                        <span>Commander ({getSelectedQty(quickViewProduct.id)}) sur WhatsApp</span>
                      </button>

                      <button
                        className="btn-primary"
                        style={{ width: '100%', justifyContent: 'center', padding: '12px', borderRadius: '24px' }}
                        onClick={() => { handleAddToCart(quickViewProduct); setQuickViewProduct(null); }}
                        disabled={quickViewProduct.stock === 0}
                      >
                        <Icon name="shopping-bag" size={16} color="#FFFFFF" />
                        <span>{quickViewProduct.stock === 0 ? 'Article Épuisé' : `Ajouter (${getSelectedQty(quickViewProduct.id)}) au Panier`}</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* WISHLIST MODAL WITH DIRECT ITEM REMOVAL BUTTON */}
          {isWishlistOpen && (
            <div className="modal-overlay" onClick={() => setIsWishlistOpen(false)}>
              <div className="modal-content" style={{ maxWidth: '540px' }} onClick={(e) => e.stopPropagation()}>
                <button className="modal-close-btn" onClick={() => setIsWishlistOpen(false)}>
                  <Icon name="x" size={18} color="#2A172E" />
                </button>
                <div style={{ padding: '24px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '18px' }}>
                    <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.4rem', color: 'var(--purple-dark)' }}>
                      Mes Favoris ({wishlistProducts.length})
                    </h3>
                  </div>

                  {wishlistProducts.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '40px 20px', color: '#6C5B70' }}>
                      <Icon name="heart" size={40} color="#E2A7B4" style={{ marginBottom: '12px' }} />
                      <p style={{ fontSize: '0.95rem', fontWeight: 600, marginBottom: '16px' }}>Votre liste de favoris est vide.</p>
                      <button
                        className="btn-primary"
                        style={{ fontSize: '0.8rem', padding: '8px 18px' }}
                        onClick={() => setIsWishlistOpen(false)}
                      >
                        Découvrir la Collection
                      </button>
                    </div>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', maxHeight: '60vh', overflowY: 'auto' }}>
                      {wishlistProducts.map(p => (
                        <div key={p.id} style={{ display: 'flex', gap: '12px', alignItems: 'center', padding: '10px 12px', borderRadius: '14px', background: '#FAF6FA', border: '1px solid rgba(226, 167, 180, 0.25)' }}>
                          <img src={p.image} alt={p.title} style={{ width: '56px', height: '68px', borderRadius: '10px', objectFit: 'cover' }} />
                          <div style={{ flex: 1 }}>
                            <div style={{ fontWeight: 700, fontSize: '0.9rem', color: 'var(--purple-dark)', marginBottom: '2px' }}>{p.title}</div>
                            <div style={{ fontWeight: 800, fontSize: '0.9rem', color: 'var(--purple-accent)' }}>{p.price.toLocaleString('fr-FR')} FCFA</div>
                          </div>
                          <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                            <button
                              className="btn-primary"
                              style={{ padding: '6px 12px', fontSize: '0.75rem', borderRadius: '10px' }}
                              onClick={() => { handleAddToCart(p); }}
                            >
                              + Panier
                            </button>

                            <button
                              onClick={() => {
                                setWishlistIds(prev => prev.filter(id => id !== p.id));
                                addToast('Article retiré des favoris.', 'info');
                              }}
                              style={{ background: '#FADBD8', color: '#E74C3C', border: 'none', width: '32px', height: '32px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}
                              title="Retirer des favoris"
                            >
                              <Icon name="trash-2" size={15} color="#E74C3C" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* SEARCH MODAL */}
          {isSearchOpen && (
            <div className="modal-overlay" onClick={() => setIsSearchOpen(false)}>
              <div className="modal-content" style={{ maxWidth: '540px' }} onClick={(e) => e.stopPropagation()}>
                <button className="modal-close-btn" onClick={() => setIsSearchOpen(false)}>
                  <Icon name="x" size={18} color="#2A172E" />
                </button>
                <div style={{ padding: '24px' }}>
                  <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.4rem', marginBottom: '12px' }}>Recherche Produit</h3>
                  <input
                    type="text"
                    placeholder="Rechercher (ex: Body Wave, Coupe Carré, Frange, Éventail...)"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="form-input"
                    style={{ width: '100%', marginBottom: '14px' }}
                    autoFocus
                  />
                  {searchedProducts.map(p => (
                    <div key={p.id} onClick={() => { setQuickViewProduct(p); setIsSearchOpen(false); }} style={{ display: 'flex', gap: '10px', alignItems: 'center', padding: '6px', cursor: 'pointer' }}>
                      <img src={p.image} alt={p.title} style={{ width: '40px', height: '50px', borderRadius: '6px', objectFit: 'cover' }} />
                      <div>
                        <div style={{ fontWeight: 600, fontSize: '0.88rem' }}>{p.title}</div>
                        <div style={{ fontSize: '0.8rem', color: '#6C5B70' }}>{p.price.toLocaleString('fr-FR')} FCFA</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* FLOATING TOASTS */}
          <div className="toast-container">
            {toasts.map(t => (
              <div key={t.id} className="toast">
                <Icon name={t.type === 'error' ? 'alert-triangle' : 'check'} size={16} color={t.type === 'error' ? '#E74C3C' : '#27AE60'} />
                <span>{t.message}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
